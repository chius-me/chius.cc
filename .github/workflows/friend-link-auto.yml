# Auto-triage friend-link PRs under content/friends/
# - Validates markdown front matter
# - Checks externalUrl reachability
# - Verifies bidirectional link on applicant's backlink page
# - Squash-merges when all checks pass
#
# Security: pull_request_target checks out the default branch only.
# PR file contents are read via GitHub API (never execute untrusted code).

name: Friend Link Auto

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "content/friends/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: friend-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (Chromium)
        run: |
          npm install -D @playwright/test
          npx playwright install-deps chromium
          npx playwright install chromium

      - name: Triage friend-link PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/friend-link/triage.js
