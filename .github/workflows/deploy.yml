name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-rendercv-2.8
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install RenderCV and fonts
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]==2.8" "pypdf==6.1.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei

      - name: Render CV
        run: |
          cd cv
          rendercv render cv-zh.yaml --output-folder rendercv_output
          cd ..
          python cv/set_pdf_metadata.py cv/rendercv_output/Yao_Chius_CV.pdf cv/rendercv_output/Yao_Chius_CV.pdf
          mkdir -p static
          cp cv/rendercv_output/Yao_Chius_CV.pdf static/cv.pdf

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.161.1"
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Add custom domains
        run: |
          npx wrangler domains add chius.cc || echo "Domain may already exist, skipping"
          npx wrangler domains add blog.chius.cc || echo "Domain may already exist, skipping"
          npx wrangler domains add cv.chius.cc || echo "Domain may already exist, skipping"
