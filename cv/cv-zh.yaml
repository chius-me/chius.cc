  sections:
    教育经历:
      - institution: 中国石油大学
        area: 通信工程
        degree: 工学学士
        location: 青岛, 中国
        start_date: 2023-09
        end_date: 2027-06
        highlights:
          - "核心课程：C/C++、信号与系统、数字电子技术、计算机网络、数据结构、Linux 嵌入式、人工智能模型与算法"

    实习经历:
      - company: 亿纬锂能
        position: Global IT 系统实施运维
        location: 惠州, 广东
        start_date: 2026-07
        end_date: 2026-09
        highlights:
          - "协助维护公司物理服务器和云端集群，参与公司 DevOps 的工作。"

    比赛经历:
      - name: 全国大学生集成电路创新创业大赛（算能杯）
        date: "2026"
      - name: 全国大学生嵌入式芯片与系统设计竞赛安路赛道
        date: "2025"
      - name: 华为 ICT 网络赛道
        date: "2025"
      - name: 大学生创新创业大赛
        date: 2024 – 2026

    技术能力:
      - label: 编程语言
        details: Shell, Go, Python, C, TypeScript
      - label: 开发工具
        details: Vim, Git, Docker, GitHub Actions, Supabase
      - label: AI Agent
        details: Codex, opencode, Hermes Agent, Multica,
      - label: Selfhost
        details: Forgejo, Argo CD, Kubernetes, Proxmox VE, TrueNAS
      - label: SaaS / PaaS
        details: GitHub, Cloudflare, AWS/GCP/阿里云
      - label: 英语能力
        details: CET-6
      - label: 兴趣方向
        details: 自动化运维、开源软件、自托管程序

    团队项目:
      - name: 'Globi-V 多模态辅助出行系统 #link("https://github.com/chius-me/globi-v")[#fa-icon("github", size: 0.85em)] #link("https://github.com/chius-me/globi-app")[#fa-icon("github", size: 0.85em)] #link("https://github.com/chius-me/globi-server")[#fa-icon("github", size: 0.85em)]'
        date: 2026-01 – 2026-07
        highlights:
          - "担任队长，牵头设计面向视障用户与家属的多端系统，协同 Milk-V Duo S 视觉端、Flutter 双模式客户端与 FastAPI 后端，覆盖道路感知、语音交互、实时定位与紧急联络。"
          - "在 SG2000 的 512 MB 内存与 0.5 TOPS INT8 TPU 约束下，完成交通灯、人行横道/导向箭头检测及盲道分割模型的训练、TPU-MLIR 量化转换与板端验证。"
          - "使用 C/C++ 打通 GC2083 摄像头、VI/VPSS、CVI Runtime 与 H.264 RTSP 实时链路，以零拷贝方式送入 TPU；实测 INT8 推理约 117 ms/帧，并行推流约 28 FPS。"
          - "负责 Flutter 客户端开发，实现视障/家属双模式、45 秒定位上报、地图追踪、8 位码绑定、语音 AI 助手与 SOS，并以安全存储保护 JWT、通过 GitHub Actions 自动构建发布 APK。"
          - "定位并修复板端头文件/ABI 不一致导致的 SIGSEGV，完善正常退出与异常中断后的 MMF 资源清理和恢复流程，提升实时链路的可重复部署能力。"

    个人项目:
      - name: HomeLab 混合云平台
        date: 2024-01 – present
        highlights:
          - "基于 Proxmox VE 搭建家庭数据中心，运行 20 余台虚拟机与百余个容器，承载代码托管、应用部署及数据存储服务。"
          - "使用 WireGuard 打通移动设备、HomeLab、AWS 及阿里云，构建覆盖本地基础设施与公有云的混合云网络架构。"
          - "使用 TrueNAS 与 ZFS RAIDZ2 构建集中存储，并部署 MinIO 提供 S3 兼容对象存储服务。"
          - "以 Forgejo 为 Git 中枢，结合 Forgejo Actions 与 Argo CD 将应用自动部署至 Kubernetes，实现 GitOps 自动化交付。"
      - name: AI Agent 工程实践
        date: 2025-06 – present
        highlights:
          - "持续使用 Codex、opencode 与 Hermes Agent 完成需求拆解、代码实现、测试验证和代码审查。"
          - "通过 Multica 将编码 Agent 接入任务看板与本地运行时，实现任务分派、进度跟踪和多 Agent 协作。"
          - "编写与复用 Agent Skills 固化开发流程，并通过 MCP 接入外部工具与数据源，扩展 Agent 的上下文和执行能力。"
      - name: Serverless 系列
        date: 2025-12 – present
        highlights:
          - '#link("https://github.com/chius-me/ilist")[#fa-icon("github", size: 0.9em)] ilist: 基于 Cloudflare Workers 的多存储文件管理平台，支持 OneDrive、Google Drive 与 S3 — #link("https://ilist.chius.cc")[ilist.chius.cc]'
          - '#link("https://github.com/chius-me/uptime-worker")[#fa-icon("github", size: 0.9em)] uptime-worker: 基于 Cloudflare Workers 的可用性监控平台，支持 HTTP/TCP 探测与故障告警 — #link("https://status.chius.cc")[status.chius.cc]'
          - '#link("https://github.com/chius-me/chius.cc")[#fa-icon("github", size: 0.9em)] chius.cc: 基于 Hugo 与 Cloudflare Workers 构建个人网站，聚合技术文章、履历与 Fediverse 内容 — #link("https://chius.cc")[chius.cc]'

