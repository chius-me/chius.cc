      - company: 亿纬锂能
        position: Global IT 系统实施运维
        location: 惠州, 广东
        start_date: 2026-07
        end_date: 2026-09
        highlights:
          - "协助维护公司物理服务器和云端集群，参与公司 DevOps 的工作。"

    比赛经历:
      - name: 全国大学生集成电路创新创业大赛（算能杯）
        date: "2026"
      - name: 全国大学生嵌入式芯片与系统设计竞赛安路赛道
        date: "2025"
      - name: 华为 ICT 网络赛道
        date: "2025"
      - name: 大学生创新创业大赛
