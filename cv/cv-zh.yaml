cv:
  name: Yao Chius
  headline: 通信工程本科生 | 嵌入式系统 · 云原生 · DevOps · HomeLabber · Linux
  photo: avatar-circle.png
  email: career@chius.cc
  custom_connections:
    - fontawesome_icon: globe
      placeholder: chius.cc
      url: https://chius.cc/
    - fontawesome_icon: github
      placeholder: GitHub
      url: https://github.com/chius-me
    - fontawesome_icon: linkedin
      placeholder: LinkedIn
      url: https://linkedin.com/in/chius-me
  sections:
    教育经历:
      - institution: 中国石油大学
        area: 通信工程
        degree: 工学学士
        location: 青岛, 中国
        start_date: 2023-09
        end_date: 2027-06
        highlights:
          - "核心课程：C/C++、信号与系统、数字电子技术、计算机网络、数据结构、Linux 嵌入式、人工智能模型与算法"

    实习经历:
      - company: 亿纬锂能
        position: 软件开发部 AI创新小组
        location: 惠州, 广东
        start_date: 2026-07
        end_date: present
        highlights:
          - "使用 Dify 编写 Workflow，集成到公司原有系统，以及供公司员工使用。"
          - "部署最新的适配华为昇腾处理器的各类大模型，压力测试，并丝滑上线生产环境"

    比赛经历:
      - name: 全国大学生集成电路创新创业大赛（算能杯）
        date: "#text[2026]"
      - name: 全国大学生嵌入式芯片与系统设计竞赛安路赛道
        date: "#text[2025]"
      - name: 华为 ICT 网络赛道
        date: "#text[2025]"
      - name: 大学生创新创业大赛
        date: 2024 – 2026

    技术能力:
      - label: 编程语言
        details: Shell, Go, Python, C, TypeScript
      - label: 开发工具
        details: Vim, Git, Docker, GitHub Actions, Supabase
      - label: AI
        details: Dify, vllm-ascend, ComfyUI, n8n, Codex, opencode, Hermes, Multica
      - label: Infra
        details: Forgejo, Argo CD, Kubernetes, Proxmox VE, TrueNAS, WireGuard, MinIO, Ansible
      - label: SaaS / PaaS
        details: GitHub, Hugging Face, Kaggle, Cloudflare, AWS/GCP/阿里云, Tailscale
      - label: 英语能力
        details: CET-6
      - label: 兴趣方向
        details: 自动化运维、开源软件、自托管程序

    团队项目:
      - name: 'Globi-V 多模态辅助出行系统 #link("https://github.com/chius-me/globi-v")[#fa-icon("github", size: 0.85em) globi-v] · #link("https://github.com/chius-me/globi-app")[#fa-icon("github", size: 0.85em) globi-app] · #link("https://github.com/chius-me/globi-server")[#fa-icon("github", size: 0.85em) globi-server]'
        date: 2026-01 – 2026-07
        highlights:
          - "使用 PyTorch 训练 YOLOv5s 交通灯/人行横道检测与 YOLOv8-Seg 盲道分割模型，经 TPU-MLIR 完成 ONNX 转换、INT8 量化与 CV181x 部署。"
          - "基于 RISC-V 64 / musl 与 CVI Runtime 开发 C/C++ 板端推理程序，并裁剪 Buildroot SDK 修复 ABI 不一致导致的崩溃。"
          - "构建 GC2083 → VI/VPSS → TPU → VENC/RTSP 零拷贝视觉管线，实现模型推理与 H.264 推流并行。"

    个人项目:
      - name: HomeLab 混合云平台
        date: 2024-01 – present
        highlights:
          - "基于 Proxmox VE 搭建家庭数据中心，运行 20 余台虚拟机与百余个容器，承载代码托管、应用部署及数据存储服务。"
          - "使用 WireGuard 打通移动设备、HomeLab、AWS 及阿里云；以 TrueNAS / ZFS 与 MinIO 提供集中与对象存储。"
          - "以 Forgejo 为 Git 中枢，结合 Forgejo Actions 与 Argo CD 将应用自动部署至 Kubernetes，实现 GitOps 自动化交付。"
      - name: AI Agent 工程实践
        date: 2025-06 – present
        highlights:
          - "持续使用 Codex、opencode 与 Hermes Agent 完成需求拆解、代码实现、测试验证和代码审查。"
          - "通过 Multica 将编码 Agent 接入任务看板与本地运行时，实现任务分派、进度跟踪和多 Agent 协作。"
          - "编写与复用 Agent Skills 固化开发流程，并通过 MCP 接入外部工具与数据源。"
      - name: AI-Native 系列
        highlights:
          - '#link("https://github.com/chius-me/minecraft-admin-mcp")[#fa-icon("github", size: 0.9em)] minecraft-admin-mcp：自托管 MCP Server，为 Agent 提供权限可控的 Minecraft Java 服管理工具集。'
          - '#link("https://github.com/chius-me/comfy-helper")[#fa-icon("github", size: 0.9em)] comfy-helper：FastAPI 网关，以命名 Profile 调用 ComfyUI 工作流并管理任务与产物。'
      - name: Serverless 系列
        highlights:
          - '#link("https://github.com/shuaiplus/nodewarden")[#fa-icon("github", size: 0.9em)] NodeWarden：参与基于 Cloudflare Workers 的 Bitwarden 兼容密码管理服务端（3.6k Star），贡献 WebSocket 鉴权加固，避免 JWT 经 URL 查询参数泄露 — #link("https://nodewarden.app")[nodewarden.app]。'
          - '#link("https://github.com/chius-me/ilist")[#fa-icon("github", size: 0.9em)] ilist：基于 Cloudflare Workers 的多存储文件管理平台，支持 OneDrive、Google Drive 与 S3 — #link("https://ilist.chius.dev")[ilist.chius.dev]。'
          - '#link("https://github.com/chius-me/uptime-worker")[#fa-icon("github", size: 0.9em)] uptime-worker：基于 Cloudflare Workers 的可用性监控平台，支持 HTTP/TCP 探测与故障告警 — #link("https://status.chius.dev")[status.chius.dev]。'
          - '#link("https://github.com/chius-me/chius.cc")[#fa-icon("github", size: 0.9em)] chius.cc：基于 Hugo 与 Cloudflare Workers 构建个人网站，聚合技术文章、履历与 Fediverse 内容 — #link("https://chius.cc")[chius.cc]。'

locale:
