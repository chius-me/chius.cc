cv:
  name: Yao Chius
  headline: 通信工程本科生 | 嵌入式系统 · 云原生 · DevOps · HomeLabber · Linux
  photo: avatar-circle.png
  email: career@chius.cc
  custom_connections:
    - fontawesome_icon: globe
      placeholder: chius.cc
      url: https://chius.cc/
    - fontawesome_icon: github
      placeholder: GitHub
      url: https://github.com/chius-me
    - fontawesome_icon: linkedin
