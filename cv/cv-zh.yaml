    技术能力:
      - label: 编程语言
        details: Shell, Go, Python, C, TypeScript
      - label: 开发工具
        details: Vim, Git, Docker, GitHub Actions, Supabase
      - label: AI Agent
        details: Codex, opencode, Hermes Agent, Multica
      - label: Selfhost
        details: Forgejo, Argo CD, Kubernetes, Proxmox VE, TrueNAS
      - label: SaaS / PaaS
        details: GitHub, Cloudflare, AWS/GCP/阿里云
      - label: 英语能力
        details: CET-6
      - label: 兴趣方向
        details: 自动化运维、开源软件、自托管程序

    个人项目:
      - name: HomeLab 混合云平台
        date: 2024-01 – present
        highlights:
          - "基于 Proxmox VE 搭建家庭数据中心，运行 20 余台虚拟机与上百个容器，承载代码托管、应用部署及数据存储服务。"
          - "使用 WireGuard 打通移动设备、HomeLab、AWS 及阿里云，构建覆盖本地基础设施与公有云的混合云网络架构。"
          - "使用 TrueNAS 与 ZFS RAIDZ2 构建集中存储，并部署 MinIO 提供 S3 兼容对象存储服务。"
          - "以 Forgejo 为 Git 中枢，结合 Forgejo Actions 与 Argo CD 将应用自动部署至 Kubernetes，实现 GitOps 自动化交付。"
      - name: Serverless 系列
        date: 2025-12 – present
        highlights:
          - 'ilist: 基于 Cloudflare Workers 的多存储文件管理平台，支持 OneDrive、Google Drive 与 S3 — #link("https://github.com/chius-me/ilist")[#fa-icon("github", size: 0.9em)] · #link("https://ilist.chius.cc")[ilist.chius.cc]'
          - 'uptime-worker: 基于 Cloudflare Workers 的可用性监控平台，支持 HTTP/TCP 探测与故障告警 — #link("https://github.com/chius-me/uptime-worker")[#fa-icon("github", size: 0.9em)] · #link("https://status.chius.cc")[status.chius.cc]'
          - 'chius.cc: 基于 Hugo 与 Cloudflare Workers 构建个人网站，聚合技术文章、履历与 Fediverse 内容 — #link("https://github.com/chius-me/chius.cc")[#fa-icon("github", size: 0.9em)] · #link("https://chius.cc")[chius.cc]'
          - 'qbittorrent-bot: 使用 Go 开发 Telegram 下载管理机器人，支持磁力链、种子任务控制与完成通知 — #link("https://github.com/chius-me/qbittorrent-bot")[#fa-icon("github", size: 0.9em)]'
      - name: AI Agent 工程实践
        date: 2025-06 – present
        highlights:
          - "持续使用 Codex、opencode 与 Hermes Agent 完成需求拆解、代码实现、测试验证和代码审查。"
          - "通过 Multica 将编码 Agent 接入任务看板与本地运行时，实现任务分派、进度跟踪和多 Agent 协作。"
          - "编写与复用 Agent Skills 固化开发流程，并通过 MCP 接入外部工具与数据源，扩展 Agent 的上下文和执行能力。"

    团队项目:
      - name: Globi-V 反馈式导盲系统
        date: 2026-01 – 2026-07
        highlights:
          - "面向视障用户构建嵌入式辅助系统，集成 Milk-V DuoS 道路视觉感知、Flutter 移动端与 FastAPI 服务端。"
          - '队长，负责模型测试、TPU 端侧部署、核间通信及 Flutter 客户端开发 — #link("https://github.com/chius-me/globi-v")[globi-v] · #link("https://github.com/chius-me/globi-app")[globi-app] · #link("https://github.com/chius-me/globi-server")[globi-server]'

