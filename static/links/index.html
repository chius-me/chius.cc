<!DOCTYPE html>
<html class="theme-auto" lang="zh-cn">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chius的社交链接</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="description" content="Chius 的个人社交链接与平台主页列表">
    <meta name="author" content="Chius">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
</head>

<body>
    <div class="container">
        <div class="column">
            <img class="avatar avatar--rounded" src="images/avatar.png" alt="Chius">
            <h1>Chius</h1>

            <div class="button-stack" role="navigation">
                <!-- Email -->
                <a class="button button-default" href="mailto:contact@chius.cc" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email">Email
                </a>
                <!-- GitHub -->
                <a class="button button-github" href="https://github.com/chius-me" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub">GitHub
                </a>
                <!-- LinkedIn -->
                <a class="button button-linked" href="https://linkedin.com/in/chius-me" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn">LinkedIn
                </a>
                <!-- Telegram -->
                <a class="button button-telegram" href="https://t.me/YaoChius" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram">Telegram
                </a>
                <!-- Mastodon -->
                <a class="button button-mastodon" href="https://social.chius.cc/@chius" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/mastodon.svg" alt="Mastodon">Mastodon
                </a>
                <!-- Bilibili -->
                <a class="button button-bilibili" href="https://space.bilibili.com/215003532" target="_blank"
                    rel="noopener" role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/bilibili.svg" alt="Bilibili">Bilibili
                </a>
                <!-- RSS -->
                <a class="button button-default" href="https://chius.cc/index.xml" target="_blank" rel="noopener"
                    role="button">
                    <img class="icon" aria-hidden="true" src="images/icons/generic-rss.svg" alt="RSS">RSS 订阅
                </a>
            </div>
        </div>
    </div>
</body>

</html>
